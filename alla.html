<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AllergieCockpit 1.4.1</title>
<style>
:root { --primary: #27ae60; --bg: #f0f2f5; --card: #ffffff; --warn: #e67e22; --critical: #e74c3c; --dark: #2c3e50; }
body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 12px; color: var(--dark); -webkit-tap-highlight-color: transparent; }
.card { background: var(--card); padding: 18px; border-radius: 22px; box-shadow: 0 5px 25px rgba(0,0,0,0.04); margin-bottom: 15px; }
h2 { margin: 0 0 12px 0; font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; }
.loc-badge { font-size: 0.9rem; font-weight: 800; color: var(--primary); background: #f0fdf4; padding: 6px 14px; border-radius: 14px; }
.p-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; min-height: 100px; align-items: center; }
.p-item { text-align: center; padding: 14px; border-radius: 18px; background: #f8fafc; border: 1px solid #f1f5f9; }
.s-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.s-btn { padding: 18px; border-radius: 18px; border: 1px solid #f1f5f9; background: white; font-weight: 600; text-align: center; font-size: 1rem; color: #475569; }
.s-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 12px rgba(39, 174, 96, 0.2); }
.btn-save { background: var(--dark); color: white; border: none; padding: 20px; width: 100%; border-radius: 18px; font-weight: 700; margin-top: 15px; font-size: 1.1rem; }
.load-box { grid-column: span 3; text-align: center; padding: 20px; border: 2px dashed #e2e8f0; border-radius: 16px; cursor: pointer; }
.btn-retry { background: var(--primary); color: white; padding: 10px 20px; border-radius: 10px; display: inline-block; margin-top: 8px; font-weight: bold; }
</style>
</head>
<body>

<div class="card">
<div style="display: flex; justify-content: space-between; align-items: center;">
<h2>📍 STANDORT</h2>
<div id="curLoc" class="loc-badge" onclick="changePLZ()">50226</div>
</div>
</div>

<div class="card">
<h2>🤧 POLLEN-STATUS</h2>
<div class="p-grid" id="pollenOut">
<div class="load-box" id="loader" onclick="fetchData()">
<div style="font-weight: 800; color: var(--dark); font-size: 1.1rem;">DATEN JETZT ABRUFEN</div>
<div id="statusTxt" style="font-size: 0.8rem; color: #94a3b8; margin-top: 4px;">Tippe zum Starten</div>
</div>
</div>
</div>

<div class="card">
<h2>🚩 HEUTE PROTOKOLLIERT</h2>
<div class="s-grid">
<div class="s-btn" onclick="this.classList.toggle('active')">Augen</div>
<div class="s-btn" onclick="this.classList.toggle('active')">Nase</div>
<div class="s-btn" onclick="this.classList.toggle('active')">Lunge</div>
<div class="s-btn" onclick="this.classList.toggle('active')">Haut</div>
<div class="s-btn" onclick="this.classList.toggle('active')">Kopf</div>
<div class="s-btn" onclick="this.classList.toggle('active')">Müde</div>
</div>
<button class="btn-save" onclick="save()">Log speichern</button>
</div>

<script>
const PROXIES = [
"https://api.allorigins.win/raw?url=",
"https://corsproxy.io/?",
"https://thingproxy.freeboard.io/fetch/"
];
const TARGET = "https://opendata.dwd.de/weather/health/pollenvorhersage/pollen_vorhersage.json"
const MAP = { "50": "41", "51": "41", "52": "41", "10": "11", "60": "51", "80": "82" };

window.onload = () => {
const plz = localStorage.getItem('userPLZ') || "50226"
document.getElementById('curLoc').innerText = plz;
};

function changePLZ() {
const p = prompt("PLZ ändern:", localStorage.getItem('userPLZ') || "50226");
if(p) { localStorage.setItem('userPLZ', p); location.reload(); }
}

async function fetchData() {
const plz = localStorage.getItem('userPLZ') || "50226"
const rid = MAP[plz.substring(0,2)] || "41"
const status = document.getElementById('statusTxt');
const loader = document.getElementById('loader');

loader.style.pointerEvents = "none"
status.innerHTML = "Verbinde... <span style='color:var(--primary)'>●</span>"

for (let p of PROXIES) {
try {
const res = await fetch(p + encodeURIComponent(TARGET + "?nocache=" + Date.now()));
if (res.ok) {
const d = await res.json();
render(d, rid);
return;
}
} catch (e) { console.error("Proxy-Fehler"); }
}
status.innerHTML = "<b style='color:var(--critical)'>Blockiert.</b><br>Prüfe Internet oder versuche es später."
loader.style.pointerEvents = "auto"
}

function render(d, rid) {
const reg = d.content.find(r => r.partregion_id == rid || r.region_id == rid);
let items = [];
for(let key in reg.pollen) {
let v = reg.pollen[key].today;
let n = v.includes('-') ? parseFloat(v.split('-')[0]) + 0.5 : parseFloat(v);
if(!isNaN(n)) items.push({n: key, v: n, t: v});
}
items.sort((a,b) => b.v - a.v);
document.getElementById('pollenOut').innerHTML = items.slice(0, 3).map(i => `
<div class="p-item">
<span style="display:block; font-size:0.7rem; font-weight:700; color:#94a3b8; margin-bottom:4px;">${i.n}</span>
<span style="font-size:1.3rem; font-weight:800; color:${i.v >= 2 ? 'var(--critical)' : (i.v >= 1 ? 'var(--warn)' : 'var(--primary)')}">${i.t}</span>
</div>
`).join('');
}

function save() {
alert("Erfolgreich protokolliert!");
document.querySelectorAll('.s-btn').forEach(b => b.classList.remove('active'));
}
</script>
</body>
</html>
