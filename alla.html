<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AllergieCockpit 1.3.9</title>
<style>
:root { --primary: #27ae60; --bg: #f0f2f5; --card: #ffffff; --warn: #e67e22; --critical: #e74c3c; --dark: #2c3e50; }
body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--dark); -webkit-font-smoothing: antialiased; }
.card { background: var(--card); padding: 15px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 12px; }
h2 { margin: 0 0 10px 0; font-size: 0.7rem; color: #95a5a6; text-transform: uppercase; letter-spacing: 1.2px; }
.header-row { display: flex; justify-content: space-between; align-items: center; }
.loc-badge { font-size: 0.85rem; font-weight: 800; color: var(--primary); background: #eafaf1; padding: 5px 12px; border-radius: 12px; }
.p-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.p-item { text-align: center; padding: 12px; border-radius: 15px; background: #f8fafb; border: 1px solid #f0f0f0; }
.p-label { display: block; font-size: 0.65rem; font-weight: 700; color: #7f8c8d; margin-bottom: 3px; }
.p-val { font-size: 1.2rem; font-weight: 800; }

.s-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.s-btn { padding: 16px; border-radius: 15px; border: 1px solid #edf2f7; background: white; font-weight: 600; text-align: center; font-size: 0.95rem; }
.s-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
.btn-save { background: var(--dark); color: white; border: none; padding: 18px; width: 100%; border-radius: 15px; font-weight: bold; margin-top: 15px; font-size: 1.1rem; }
.status-msg { grid-column: span 3; text-align: center; padding: 20px; font-size: 0.85rem; color: #e74c3c; cursor: pointer; }
.loading-dots:after { content: ' .'; animation: dots 1.5s steps(5, end) infinite; }
@keyframes dots { 0%, 20% { color: rgba(0,0,0,0); text-shadow: .5em 0 0 rgba(0,0,0,0), 1em 0 0 rgba(0,0,0,0); }
40% { color: #95a5a6; text-shadow: .5em 0 0 rgba(0,0,0,0), 1em 0 0 rgba(0,0,0,0); }
60% { text-shadow: .5em 0 0 #95a5a6, 1em 0 0 rgba(0,0,0,0); }
80%, 100% { text-shadow: .5em 0 0 #95a5a6, 1em 0 0 #95a5a6; } }
</style>
</head>
<body>

<div class="card">
<div class="header-row">
<h2>📍 STANDORT</h2>
<div id="curLoc" class="loc-badge" onclick="resetPLZ()">50226</div>
</div>
</div>

<div class="card">
<h2>🤧 POLLEN-STATUS</h2>
<div class="p-grid" id="pollenOut">
<div class="status-msg" id="status" onclick="location.reload()" style="color:#95a5a6">
Verbindung wird aufgebaut<span class="loading-dots"></span>
</div>
</div>
</div>

<div class="card">
<h2>🚩 HEUTE PROTOKOLLIERT</h2>
<div class="s-grid">
<div class="s-btn" onclick="this.classList.toggle('active')">Augen</div>
<div class="s-btn" onclick="this.classList.toggle('active')">Nase</div>
<div class="s-btn" onclick="this.classList.toggle('active')">Lunge</div>
<div class="s-btn" onclick="this.classList.toggle('active')">Haut</div>
<div class="s-btn" onclick="this.classList.toggle('active')">Kopf</div>
<div class="s-btn" onclick="this.classList.toggle('active')">Müde</div>
</div>
<button class="btn-save" onclick="save()">Log speichern</button>
</div>

<script>
// Drei verschiedene Wege zum Ziel
const PROXIES = [
"https://corsproxy.io/?",
"https://api.allorigins.win/raw?url=",
"https://thingproxy.freeboard.io/fetch/"
];
const TARGET = "https://opendata.dwd.de/weather/health/pollenvorhersage/pollen_vorhersage.json"
const MAP = { "50": "41", "51": "41", "52": "41", "10": "11", "60": "51", "80": "82", "20": "21" };

window.onload = () => {
const plz = localStorage.getItem('userPLZ') || "50226"
document.getElementById('curLoc').innerText = plz;
fetchData(plz);
};

function resetPLZ() {
const p = prompt("Neue PLZ eingeben:", "50226");
if(p && p.length >= 2) {
localStorage.setItem('userPLZ', p);
location.reload();
}
}

async function fetchData(plz) {
const out = document.getElementById('pollenOut');
const rid = MAP[plz.substring(0,2)] || "41"

for (let p of PROXIES) {
try {
const res = await fetch(p + encodeURIComponent(TARGET) + "?t=" + Date.now());
if (!res.ok) continue;
const d = await res.json();
render(d, rid);
return;
} catch (e) { console.log("Proxy failed, trying next..."); }
}
out.innerHTML = '<div class="status-msg">Abruf klemmt.<br>Tippe zum Neuladen.</div>';
}

function render(d, rid) {
const reg = d.content.find(r => r.partregion_id == rid || r.region_id == rid);
let items = [];
for(let key in reg.pollen) {
let v = reg.pollen[key].today;
let n = v.includes('-') ? parseFloat(v.split('-')[0]) + 0.5 : parseFloat(v);
if(!isNaN(n)) items.push({n: key, v: n, t: v});
}
items.sort((a,b) => b.v - a.v);

document.getElementById('pollenOut').innerHTML = items.slice(0, 3).map(i => `
<div class="p-item">
<span class="p-label">${i.n}</span>
<span class="p-val" style="color:${i.v >= 2 ? '#e74c3c' : (i.v >= 1 ? '#e67e22' : '#27ae60')}">${i.t}</span>
</div>
`).join('');
}

function save() {
alert("Tages-Log wurde lokal gesichert!");
document.querySelectorAll('.s-btn').forEach(b => b.classList.remove('active'));
}
</script>
</body>
</html>
