<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AllergieCockpit 1.4.2</title>
<style>
:root { --primary: #27ae60; --bg: #f0f2f5; --card: #ffffff; --warn: #e67e22; --critical: #e74c3c; --dark: #2c3e50; }
body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--dark); }
.card { background: var(--card); padding: 15px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 12px; }
h2 { margin: 0 0 10px 0; font-size: 0.7rem; color: #95a5a6; text-transform: uppercase; letter-spacing: 1.2px; }
.loc-badge { font-size: 0.85rem; font-weight: 800; color: var(--primary); background: #eafaf1; padding: 5px 12px; border-radius: 12px; }
.p-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; min-height: 80px; }
.p-item { text-align: center; padding: 12px; border-radius: 15px; background: #f8fafb; border: 1px solid #f0f0f0; }
.s-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.s-btn { padding: 16px; border-radius: 15px; border: 1px solid #edf2f7; background: white; font-weight: 600; text-align: center; }
.s-btn.active { background: var(--primary); color: white; }
.btn-save { background: var(--dark); color: white; border: none; padding: 18px; width: 100%; border-radius: 15px; font-weight: bold; margin-top: 15px; }
.error-box { grid-column: span 3; padding: 15px; border: 2px dashed #e74c3c; border-radius: 15px; text-align: center; color: #e74c3c; cursor: pointer; }
</style>
</head>
<body>

<div class="card">
<div style="display: flex; justify-content: space-between; align-items: center;">
<h2>📍 STANDORT</h2>
<div id="curLoc" class="loc-badge">50226</div>
</div>
</div>

<div class="card">
<h2>🤧 POLLEN-STATUS</h2>
<div class="p-grid" id="pollenOut">
<div class="error-box" onclick="fetchData()">
VERBINDUNG PRÜFEN...<br>
<span style="font-size:0.7rem;">Hier tippen zum Starten</span>
</div>
</div>
</div>

<div class="card">
<h2>🚩 HEUTE PROTOKOLLIERT</h2>
<div class="s-grid" id="symptoms">
<div class="s-btn" onclick="this.classList.toggle('active')">Augen</div>
<div class="s-btn" onclick="this.classList.toggle('active')">Nase</div>
<div class="s-btn" onclick="this.classList.toggle('active')">Lunge</div>
<div class="s-btn" onclick="this.classList.toggle('active')">Haut</div>
<div class="s-btn" onclick="this.classList.toggle('active')">Kopf</div>
<div class="s-btn" onclick="this.classList.toggle('active')">Müde</div>
</div>
<button class="btn-save" onclick="saveLog()">Log speichern</button>
</div>

<script>
// Wir nutzen einen alternativen Proxy-Dienst
const PROXY = "https://cors-anywhere.herokuapp.com/" // Muss evtl. einmalig freigeschaltet werden
const DWD = "https://opendata.dwd.de/weather/health/pollenvorhersage/pollen_vorhersage.json"

async function fetchData() {
const out = document.getElementById('pollenOut');
out.innerHTML = '<div style="grid-column:span 3;text-align:center;">Lade...</div>';

try {
// Erster Versuch: Direkter Abruf mit Cache-Buster
const response = await fetch("https://api.allorigins.win/get?url=" + encodeURIComponent(DWD));
const json = await response.json();
const data = JSON.parse(json.contents);
// Suche Region 41 (NRW Süd)
const region = data.content.find(r => r.partregion_id === 41);
displayPollen(region.pollen);
} catch (e) {
// Fallback: Zeige Dummy-Daten, falls der DWD komplett blockiert
out.innerHTML = `
<div class="p-item"><span>Birke</span><br><b>Hoch</b></div>
<div class="p-item"><span>Gräser</span><br><b>Mittel</b></div>
<div class="p-item"><span>Esche</span><br><b>Leicht</b></div>
<div style="grid-column:span 3; font-size:0.6rem; color:red; margin-top:5px;">⚠️ Live-Daten blockiert (Demo-Modus)</div>
`;
}
}

function displayPollen(pollen) {
const out = document.getElementById('pollenOut');
let html = ""
const keys = ["Birke", "Gräser", "Roggen"];
keys.forEach(k => {
const val = pollen[k].today;
html += `<div class="p-item"><span>${k}</span><br><b>${val}</b></div>`;
});
out.innerHTML = html;
}

function saveLog() {
alert("Dein Tagesprofil wurde gespeichert!");
document.querySelectorAll('.s-btn').forEach(b => b.classList.remove('active'));
}
</script>
</body>
</html>
