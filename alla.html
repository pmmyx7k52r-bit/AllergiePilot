<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AllergieCockpit 1.4.1</title>
<style>
:root { --primary: #27ae60; --bg: #f0f2f5; --card: #ffffff; --warn: #e67e22; --critical: #e74c3c; --dark: #2c3e50; }
body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--dark); }
.card { background: var(--card); padding: 15px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 12px; }
h2 { margin: 0 0 10px 0; font-size: 0.7rem; color: #95a5a6; text-transform: uppercase; letter-spacing: 1.2px; }
.loc-badge { font-size: 0.85rem; font-weight: 800; color: var(--primary); background: #eafaf1; padding: 5px 12px; border-radius: 12px; }
.p-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; min-height: 80px; align-items: center; }
.p-item { text-align: center; padding: 12px; border-radius: 15px; background: #f8fafb; border: 1px solid #f0f0f0; }
.s-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.s-btn { padding: 16px; border-radius: 15px; border: 1px solid #edf2f7; background: white; font-weight: 600; text-align: center; -webkit-tap-highlight-color: transparent; }
.s-btn.active { background: var(--primary); color: white; }
.btn-save { background: var(--dark); color: white; border: none; padding: 18px; width: 100%; border-radius: 15px; font-weight: bold; margin-top: 15px; font-size: 1.1rem; }
/* Interaktiver Fix-Button */
.fix-trigger {
grid-column: span 3; background: #fff5f5; border: 2px dashed var(--critical); color: var(--critical);
padding: 20px; border-radius: 15px; text-align: center; font-weight: bold; cursor: pointer;
}
</style>
</head>
<body>

<div class="card">
<div style="display: flex; justify-content: space-between; align-items: center;">
<h2>📍 STANDORT</h2>
<div id="curLoc" class="loc-badge" onclick="location.reload()">50226</div>
</div>
</div>

<div class="card">
<h2>🤧 POLLEN-STATUS</h2>
<div class="p-grid" id="pollenOut">
<div class="fix-trigger" onclick="fetchData('50226')">
DATENABRUF STARTEN<br>
<span style="font-size:0.7rem; font-weight:normal;">Hier tippen, um Blockade zu lösen</span>
</div>
</div>
</div>

<div class="card">
<h2>🚩 HEUTE PROTOKOLLIERT</h2>
<div class="s-grid">
<div class="s-btn" onclick="this.classList.toggle('active')">Augen</div>
<div class="s-btn" onclick="this.classList.toggle('active')">Nase</div>
<div class="s-btn" onclick="this.classList.toggle('active')">Lunge</div>
<div class="s-btn" onclick="this.classList.toggle('active')">Haut</div>
<div class="s-btn" onclick="this.classList.toggle('active')">Kopf</div>
<div class="s-btn" onclick="this.classList.toggle('active')">Müde</div>
</div>
<button class="btn-save" onclick="alert('Gespeichert!')">Log speichern</button>
</div>

<script>
const PROXY = "https://api.allorigins.win/raw?url="
const TARGET = encodeURIComponent("https://opendata.dwd.de/weather/health/pollenvorhersage/pollen_vorhersage.json");

async function fetchData(plz) {
const out = document.getElementById('pollenOut');
out.innerHTML = '<div style="grid-column:span 3; text-align:center;">Lade...</div>';
try {
const res = await fetch(PROXY + TARGET + "&cache=" + Date.now());
const d = await res.json();
const reg = d.content.find(r => r.region_id == 41 || r.partregion_id == 41);
let html = ""
// Top 3 anzeigen
const top = ["Birke", "Gräser", "Roggen"];
top.forEach(p => {
const val = reg.pollen[p].today || "0"
html += `<div class="p-item"><span style="display:block;font-size:0.6rem;">${p}</span><span style="font-size:1.1rem;font-weight:bold;">${val}</span></div>`;
});
out.innerHTML = html;
} catch (e) {
out.innerHTML = '<div class="fix-trigger" onclick="location.reload()">BLOCKADE AKTIV<br><span style="font-size:0.7rem;">Bitte Seite neu laden</span></div>';
}
}
</script>
</body>
</html>
