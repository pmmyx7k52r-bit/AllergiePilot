<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AllergieCockpit 1.4.1</title>
<style>
:root { --primary: #27ae60; --bg: #f0f2f5; --card: #ffffff; --warn: #e67e22; --critical: #e74c3c; --dark: #2c3e50; }
body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--dark); }
.card { background: var(--card); padding: 15px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 12px; }
h2 { margin: 0 0 10px 0; font-size: 0.7rem; color: #95a5a6; text-transform: uppercase; letter-spacing: 1.2px; }
.loc-badge { font-size: 0.85rem; font-weight: 800; color: var(--primary); background: #eafaf1; padding: 5px 12px; border-radius: 12px; }
.p-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; min-height: 80px; }
.p-item { text-align: center; padding: 12px; border-radius: 15px; background: #f8fafb; border: 1px solid #f0f0f0; }
.s-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.s-btn { padding: 16px; border-radius: 15px; border: 1px solid #edf2f7; background: white; font-weight: 600; text-align: center; -webkit-tap-highlight-color: transparent; }
.s-btn.active { background: var(--primary); color: white; }
.btn-save { background: var(--dark); color: white; border: none; padding: 18px; width: 100%; border-radius: 15px; font-weight: bold; margin-top: 15px; font-size: 1.1rem; }
.err-box { grid-column: span 3; text-align: center; color: var(--critical); font-size: 0.8rem; padding: 10px; border: 1px dashed var(--critical); border-radius: 10px; cursor: pointer; }
</style>
</head>
<body>

<div class="card">
<div style="display: flex; justify-content: space-between; align-items: center;">
<h2>📍 STANDORT</h2>
<div id="curLoc" class="loc-badge" onclick="change()">50226</div>
</div>
</div>

<div class="card">
<h2>🤧 POLLEN-STATUS</h2>
<div class="p-grid" id="out">
<div style="grid-column: span 3; text-align: center; color: #95a5a6; padding: 20px;">Suche Datenquelle...</div>
</div>
</div>

<div class="card">
<h2>🚩 HEUTE PROTOKOLLIERT</h2>
<div class="s-grid">
<div class="s-btn" onclick="this.classList.toggle('active')">Augen</div>
<div class="s-btn" onclick="this.classList.toggle('active')">Nase</div>
<div class="s-btn" onclick="this.classList.toggle('active')">Lunge</div>
<div class="s-btn" onclick="this.classList.toggle('active')">Haut</div>
<div class="s-btn" onclick="this.classList.toggle('active')">Kopf</div>
<div class="s-btn" onclick="this.classList.toggle('active')">Müde</div>
</div>
<button class="btn-save" onclick="alert('Gespeichert!')">Log speichern</button>
</div>

<script>
const PROXIES = ["https://corsproxy.io/?", "https://api.allorigins.win/raw?url="];
// Aktualisierter Pfad (DWD nutzt manchmal Unterordner je nach Saison)
const DWD_PATH = "https://opendata.dwd.de/weather/health/pollenvorhersage/pollen_vorhersage.json"
const MAP = { "50": "41", "51": "41", "52": "41", "10": "11", "60": "51", "80": "82" };

window.onload = () => {
const plz = localStorage.getItem('userPLZ') || "50226"
document.getElementById('curLoc').innerText = plz;
load(plz);
};

function change() {
const p = prompt("PLZ:", "50226");
if(p) { localStorage.setItem('userPLZ', p); location.reload(); }
}

async function load(plz) {
const rid = MAP[plz.substring(0,2)] || "41"
const display = document.getElementById('out');

for (let proxy of PROXIES) {
try {
const res = await fetch(proxy + encodeURIComponent(DWD_PATH));
if (res.status === 404) continue; // Versuche nächsten Proxy falls 404
if (res.ok) {
const d = await res.json();
render(d, rid);
return;
}
} catch (e) {}
}
display.innerHTML = `<div class="err-box" onclick="location.reload()">
<b>DWD DATEN-FEHLER (404)</b><br>Quelle momentan nicht erreichbar.<br>Tippe zum Neuladen.
</div>`;
}

function render(d, rid) {
const reg = d.content.find(r => r.partregion_id == rid || r.region_id == rid);
let items = [];
for(let k in reg.pollen) {
let v = reg.pollen[k].today;
let n = v.includes('-') ? parseFloat(v.split('-')[0]) + 0.5 : parseFloat(v);
if(!isNaN(n)) items.push({n: k, v: n, t: v});
}
items.sort((a,b) => b.v - a.v);
document.getElementById('out').innerHTML = items.slice(0, 3).map(i => `
<div class="p-item">
<span style="display:block; font-size:0.6rem; font-weight:700; color:#7f8c8d; text-transform:uppercase;">${i.n}</span>
<span style="font-size:1.1rem; font-weight:800; color:${i.v >= 2 ? '#e74c3c' : (i.v >= 1 ? '#e67e22' : '#27ae60')}">${i.t}</span>
</div>
`).join('');
}
</script>
</body>
</html>
